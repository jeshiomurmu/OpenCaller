name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: android
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # Caches Gradle dependencies and validates the Gradle wrapper JAR checksum.
      - uses: gradle/actions/setup-gradle@v6

      - name: Lint, test and assemble both flavors
        # --continue: run every task and report all failures in one CI run.
        run: >-
          ./gradlew --continue
          spotlessCheck detekt lint
          testFossDebugUnitTest testPlayDebugUnitTest
          assembleFossDebug assemblePlayDebug
          assembleFossRelease
          check

      # Room writes the schema while compiling; it must be committed (docs/architecture.md §6).
      - name: Room schemas are committed
        run: |
          git add --intent-to-add core/database/schemas
          if ! git diff --exit-code -- core/database/schemas; then
            echo "::error::Room schema changed or missing: commit android/core/database/schemas (diff above)"
            exit 1
          fi

  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend/server
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Check (format, static analysis, tests incl. Testcontainers PostgreSQL + Redis)
        run: ./gradlew check

      - name: Bucket test vectors match the app's copy
        run: cmp src/test/resources/fixtures/bucket_vectors.csv ../../android/core/testing/src/main/resources/fixtures/bucket_vectors.csv

  emulator:
    name: emulator (API ${{ matrix.api-level }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # minSdk and targetSdk.
        api-level: [29, 36]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Assemble foss debug APK
        working-directory: android
        run: ./gradlew assembleFossDebug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instrumented tests (DB, onboarding TC-ONB-*), app walk in light and dark mode, blocking QA (TC-BLK-*), in-call QA (TC-INCALL-001)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          # system_server ran out of its 16 MB heap on the API 29 image (DeadSystemException mid-test, run 38891529407).
          ram-size: 4096M
          heap-size: 512M
          disable-animations: true
          script: |
            cd android && ./gradlew --continue :core:database:connectedDebugAndroidTest :app:connectedFossDebugAndroidTest || { find core/database/build/outputs/androidTest-results app/build/outputs/androidTest-results \( -name '*.xml' -o -name '*.txt' \) -exec cat {} +; adb logcat -d -b crash; adb logcat -d | grep -iE 'opencaller|AndroidRuntime|RoleController|Killing' | tail -n 400; exit 1; }
            scripts/ci/emulator-smoke.sh android/app/build/outputs/apk/foss/debug/app-foss-debug.apk io.github.jeshiomurmu.opencaller.debug build/emulator/api-${{ matrix.api-level }}
            scripts/qa/blocking.sh android/app/build/outputs/apk/foss/debug/app-foss-debug.apk io.github.jeshiomurmu.opencaller.debug build/emulator/api-${{ matrix.api-level }}/blocking || { adb logcat -d | grep -iE 'opencaller|Telecom|CallScreen|AndroidRuntime' | tail -n 400; exit 1; }
            scripts/qa/incall.sh io.github.jeshiomurmu.opencaller.debug build/emulator/api-${{ matrix.api-level }}/incall || { adb logcat -d | grep -iE 'opencaller|Telecom|InCall|ActivityTaskManager|AndroidRuntime' | tail -n 400; exit 1; }
            scripts/qa/sms.sh io.github.jeshiomurmu.opencaller.debug build/emulator/api-${{ matrix.api-level }}/sms || { adb logcat -d | grep -iE 'opencaller|SmsManager|InboundSms|SMSDispatcher|AndroidRuntime' | tail -n 400; exit 1; }

      - name: Upload screenshots and test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: emulator-api-${{ matrix.api-level }}
          path: |
            build/emulator/
            android/core/database/build/reports/androidTests/
            android/app/build/reports/androidTests/
          if-no-files-found: ignore

  e2e:
    name: e2e (TC-E2E-001)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Assemble foss debug APK
        working-directory: android
        run: ./gradlew assembleFossDebug

      - name: Create .env with throwaway credentials
        working-directory: infra/docker
        run: |
          sed -e "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=$(openssl rand -hex 16)/" \
              -e "s/^REDIS_PASSWORD=.*/REDIS_PASSWORD=$(openssl rand -hex 16)/" \
              -e "s/^MINIO_ROOT_PASSWORD=.*/MINIO_ROOT_PASSWORD=$(openssl rand -hex 16)/" \
              -e "s/^JWT_SECRET=.*/JWT_SECRET=$(openssl rand -hex 32)/" \
              -e "s/^OTP_PEPPER=.*/OTP_PEPPER=$(openssl rand -hex 32)/" \
              -e "s/^ADMIN_TOKEN=.*/ADMIN_TOKEN=$(openssl rand -hex 32)/" \
              .env.example > .env

      - name: Build and start the stack
        run: GIT_SHA="${GITHUB_SHA::7}" docker compose -f infra/docker/compose.yml up -d --build --wait --wait-timeout 300

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Device A reports, the server's jobs run, device B updates its list and blocks
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          disable-animations: true
          script: scripts/e2e/ci.sh 36 android/app/build/outputs/apk/foss/debug/app-foss-debug.apk io.github.jeshiomurmu.opencaller.debug build/e2e

      - name: Server logs
        if: always()
        run: docker compose -f infra/docker/compose.yml logs --no-color --tail 300 server

      - name: Upload emulator logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e
          path: build/e2e/
          if-no-files-found: ignore

      - name: Stop the stack
        if: always()
        run: docker compose -f infra/docker/compose.yml down -v

  compose:
    name: compose smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Create .env with throwaway credentials
        working-directory: infra/docker
        run: |
          sed -e "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=$(openssl rand -hex 16)/" \
              -e "s/^REDIS_PASSWORD=.*/REDIS_PASSWORD=$(openssl rand -hex 16)/" \
              -e "s/^MINIO_ROOT_PASSWORD=.*/MINIO_ROOT_PASSWORD=$(openssl rand -hex 16)/" \
              -e "s/^JWT_SECRET=.*/JWT_SECRET=$(openssl rand -hex 32)/" \
              -e "s/^OTP_PEPPER=.*/OTP_PEPPER=$(openssl rand -hex 32)/" \
              -e "s/^ADMIN_TOKEN=.*/ADMIN_TOKEN=$(openssl rand -hex 32)/" \
              .env.example > .env

      - name: Build and start the stack
        run: GIT_SHA="${GITHUB_SHA::7}" docker compose -f infra/docker/compose.yml up -d --build --wait --wait-timeout 300

      - name: GET /health
        run: |
          curl -fsS localhost:8080/health | tee health.json
          echo
          grep -q "\"status\":\"ok\",\"version\":\"${GITHUB_SHA::7}\"" health.json

      - name: API smoke test (scripts/smoke.sh)
        run: scripts/smoke.sh

      - name: Service status and logs
        if: always()
        run: |
          docker compose -f infra/docker/compose.yml ps
          docker compose -f infra/docker/compose.yml logs --no-color --tail 200

      - name: Stop the stack
        if: always()
        run: docker compose -f infra/docker/compose.yml down -v

  ml:
    name: ml (sms-classifier)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # The runner's Python 3.12; pytest pinned in ml/sms-classifier/pyproject.toml. No model is trained here.
      - name: Corpus, features and training gate (pytest)
        working-directory: ml/sms-classifier
        run: |
          python3 --version
          python3 -m venv .venv
          .venv/bin/pip install --quiet -e '.[test]'
          .venv/bin/pytest -q

      # The corpus in core:testing must be exactly what the generator writes (the app's tests read it).
      - name: Committed corpus matches the generator
        run: |
          python3 -I ml/sms-classifier/corpus/generate.py
          git diff --exit-code -- android/core/testing/src/main/resources/fixtures/sms_corpus

  license:
    name: license
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      # sha256 of https://www.gnu.org/licenses/gpl-3.0.txt, verified in CI against a live download on 2026-10-16
      # (offline check: a live download made CI depend on www.gnu.org being reachable).
      - name: LICENSE is the verbatim GPL-3.0 text from gnu.org
        run: echo "3972dc9744f6499f0f9b2dbf76696f2ae7ad8af9b23dde66d6af86c9dfb36986  LICENSE" | sha256sum --check
