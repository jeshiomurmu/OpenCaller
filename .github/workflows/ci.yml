name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: android
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      # Caches Gradle dependencies and validates the Gradle wrapper JAR checksum.
      - uses: gradle/actions/setup-gradle@v6

      - name: Lint, test and assemble both flavors
        run: >-
          ./gradlew
          spotlessCheck detekt lint
          testFossDebugUnitTest testPlayDebugUnitTest
          assembleFossDebug assemblePlayDebug

  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend/server
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Check (format, static analysis, tests)
        run: ./gradlew check
