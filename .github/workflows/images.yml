name: Images

# A version tag (v1.2.0, v1.2.0-beta) builds the backend images and pushes them to the GitHub Container Registry with
# SLSA provenance and an SBOM attached (docker/build-push-action): ghcr.io/jeshiomurmu/opencaller-<name>:<version>, plus
# :latest for a final release. infra/deploy/compose.prod.yml pulls these. Pipeline-test tags (v0.0.0-ci-test*) build
# every image without pushing.
#
# The packages are created under the repository owner on the first push; make them public once (GitHub → your profile
# → Packages → opencaller-… → Package settings → Change visibility) so a server can pull without logging in.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: server
            context: backend/server
            target: runtime
          - name: transcoder
            context: backend/server
            target: transcoder
          - name: agents
            context: backend/agents
            target: ""
          - name: voice-spoof
            context: ml/voice-spoof
            target: ""
          - name: minio
            context: infra/docker/minio
            target: ""
    env:
      PUSH: ${{ !startsWith(github.ref_name, 'v0.0.0-ci-test') }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/opencaller-${{ matrix.name }}
          # v1.2.0 → 1.2.0, 1.2 and latest; v1.2.0-beta → 1.2.0-beta only.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            latest=auto
          labels: |
            org.opencontainers.image.title=opencaller-${{ matrix.name }}
            org.opencontainers.image.licenses=GPL-3.0-or-later

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # SLSA provenance (max: build parameters and source) and an SPDX SBOM, attached to the image index.
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
