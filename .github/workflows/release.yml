name: Release

# A version tag (v0.1.0-alpha, v1.2.3) builds the signed foss release APK and publishes it with its SHA-256 as a
# GitHub release (a pre-release when the version has a suffix such as -alpha). The signing key comes from four
# repository secrets and never touches the repository:
#   OPENCALLER_KEYSTORE_BASE64   the keystore file, base64-encoded
#   OPENCALLER_KEYSTORE_PASSWORD the keystore password
#   OPENCALLER_KEY_ALIAS         the key's alias
#   OPENCALLER_KEY_PASSWORD      the key's password
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  foss-apk:
    name: signed foss APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Check the tag matches versionName
        run: |
          version="$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' android/app/build.gradle.kts)"
          if [[ "v$version" != "$TAG" ]]; then
            echo "::error::tag $TAG doesn't match versionName $version in android/app/build.gradle.kts"
            exit 1
          fi

      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.OPENCALLER_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo "::error::repository secret OPENCALLER_KEYSTORE_BASE64 is not set"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "OPENCALLER_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build the foss release APK
        working-directory: android
        env:
          OPENCALLER_KEYSTORE_PASSWORD: ${{ secrets.OPENCALLER_KEYSTORE_PASSWORD }}
          OPENCALLER_KEY_ALIAS: ${{ secrets.OPENCALLER_KEY_ALIAS }}
          OPENCALLER_KEY_PASSWORD: ${{ secrets.OPENCALLER_KEY_PASSWORD }}
        run: ./gradlew assembleFossRelease

      - name: Verify the signature and compute the SHA-256
        run: |
          apk=android/app/build/outputs/apk/foss/release/app-foss-release.apk
          test -f "$apk" || { echo "::error::no signed APK at $apk"; ls -R android/app/build/outputs/apk; exit 1; }
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$apksigner" verify --verbose --print-certs "$apk"
          name="OpenCaller-$TAG-foss.apk"
          mkdir -p dist
          cp "$apk" "dist/$name"
          (cd dist && sha256sum "$name" > "$name.sha256" && cat "$name.sha256")

      - name: Release notes from CHANGELOG.md
        run: |
          version="${TAG#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^(## )?\[/ { exit }
            on { print }
          ' CHANGELOG.md > dist/notes.md
          {
            echo
            echo "SHA-256 of the APK: \`$(cut -d' ' -f1 "dist/OpenCaller-$TAG-foss.apk.sha256")\`"
            echo "Check it with \`sha256sum -c OpenCaller-$TAG-foss.apk.sha256\` before installing."
          } >> dist/notes.md
          cat dist/notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=""
          if [[ "$TAG" == *-* ]]; then prerelease="--prerelease"; fi
          gh release create "$TAG" "dist/OpenCaller-$TAG-foss.apk" "dist/OpenCaller-$TAG-foss.apk.sha256" \
            --title "OpenCaller ${TAG#v}" --notes-file dist/notes.md --verify-tag $prerelease

      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
