# Temporary (Phase 10): reads Google Maven's metadata for dependencies whose release pages the agent sandbox
# can't reach. Removed before the Phase 10 PR.
name: verify deps

on:
  push:
    branches: [phase/10-supporter]
    paths: [.github/workflows/verify-deps.yml]

permissions:
  contents: read

jobs:
  google-maven:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Versions and AAR metadata on Google Maven
        run: |
          set -euo pipefail
          base=https://dl.google.com/android/maven2
          for a in com/android/billingclient/billing com/android/billingclient/billing-ktx com/google/android/gms/play-services-auth; do
            echo "== $a"
            curl -fsS "$base/$a/maven-metadata.xml" | tr -d ' ' | grep -E '<(latest|release|lastUpdated)>|<version>' | tail -12
          done
          check() {
            echo "== $1:$2"
            name=$(basename "$1")
            curl -fsS -o "a.aar" "$base/$1/$2/$name-$2.aar"
            unzip -p a.aar META-INF/com/android/build/gradle/aar-metadata.properties || echo "(no aar-metadata)"
            unzip -p a.aar AndroidManifest.xml | grep -Eo 'android:(minSdkVersion|targetSdkVersion)="[0-9]+"' || true
            curl -fsS "$base/$1/$2/$name-$2.pom" | grep -A3 '<dependency>' | grep -E 'artifactId|<version>' | paste - - || true
          }
          check com/android/billingclient/billing 9.1.0
          check com/android/billingclient/billing-ktx 9.1.0
          for v in 21.6.0 22.0.0; do check com/google/android/gms/play-services-auth "$v" || echo "(not found: $v)"; done
