# Temporary (Phase 11): reads Google Maven's metadata for dependencies whose release pages the agent sandbox
# can't reach. Removed before the Phase 11 PR.
name: verify deps

on:
  push:
    branches: [phase/11-voip]
    paths: [.github/workflows/verify-deps.yml]

permissions:
  contents: read

jobs:
  google-maven:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Versions and AAR metadata on Google Maven
        run: |
          set -uo pipefail
          base=https://dl.google.com/android/maven2
          check() {
            name=$(basename "$1")
            echo "---- $1:$2"
            if curl -fsS -o a.aar "$base/$1/$2/$name-$2.aar"; then
              unzip -p a.aar META-INF/com/android/build/gradle/aar-metadata.properties | grep -E 'minCompileSdk=|minAndroidGradle' || echo "(no aar-metadata)"
              unzip -p a.aar AndroidManifest.xml | grep -Eo 'android:minSdkVersion="[0-9]+"|android.permission.[A-Z_]+' | sort -u || true
            else
              echo "(no aar)"
            fi
            curl -fsS "$base/$1/$2/$name-$2.pom" | python3 -c 'import re,sys
          for d in re.findall(r"<dependency>(.*?)</dependency>", sys.stdin.read(), re.S):
              g = lambda t: (re.search(f"<{t}>(.*?)</{t}>", d) or [None, ""])[1]
              print("  ", g("groupId"), g("artifactId"), g("version"), g("scope"))' || true
          }
          for a in androidx/core/core-telecom androidx/camera/camera-core androidx/camera/camera-camera2 \
                   androidx/camera/camera-lifecycle androidx/camera/camera-video androidx/camera/camera-view \
                   com/google/firebase/firebase-messaging; do
            echo "======== $a"
            versions=$(curl -fsS "$base/$a/maven-metadata.xml" | grep -oE '<version>[^<]+' | sed 's/<version>//')
            echo "$versions" | tail -8 | tr '\n' ' '; echo
            stable=$(echo "$versions" | grep -viE 'alpha|beta|rc|dev' | tail -3)
            for v in $stable; do check "$a" "$v"; done
          done
