# Temporary (Phase 11): prints the public API of Google Maven artifacts the agent sandbox can't download
# (dl.google.com is blocked there). Removed before the Phase 11 PR.
name: verify deps

on:
  push:
    branches: [phase/11-voip]
    paths: [.github/workflows/verify-deps.yml]

permissions:
  contents: read

jobs:
  google-maven-api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: javap of the classes Phase 11 calls
        run: |
          set -uo pipefail
          base=https://dl.google.com/android/maven2
          api() { # group/path artifact version class…
            local path="$1" name="$2" version="$3"; shift 3
            echo "======== $name:$version"
            curl -fsS -o "$name.aar" "$base/$path/$name/$version/$name-$version.aar" || { echo "(no aar)"; return; }
            unzip -o -q "$name.aar" classes.jar AndroidManifest.xml -d "$name"
            echo "-- manifest"; cat "$name/AndroidManifest.xml"
            for c in "$@"; do javap -public -cp "$name/classes.jar" "$c" || echo "(no $c)"; done
            curl -fsS "$base/$path/$name/$version/$name-$version.pom" | grep -A3 '<dependency>' | grep -E 'artifactId|version' | paste - - || true
          }
          api androidx/core core-telecom 1.0.1 androidx.core.telecom.CallsManager 'androidx.core.telecom.CallsManager$Companion' \
            androidx.core.telecom.CallAttributesCompat 'androidx.core.telecom.CallAttributesCompat$Companion' \
            androidx.core.telecom.CallControlScope androidx.core.telecom.CallControlResult \
            'androidx.core.telecom.CallControlResult$Success' 'androidx.core.telecom.CallControlResult$Error' \
            androidx.core.telecom.CallEndpointCompat 'androidx.core.telecom.CallEndpointCompat$Companion' androidx.core.telecom.CallException
          api androidx/camera camera-video 1.6.2 androidx.camera.video.Recorder 'androidx.camera.video.Recorder$Builder' \
            androidx.camera.video.VideoCapture androidx.camera.video.FileOutputOptions 'androidx.camera.video.FileOutputOptions$Builder' \
            androidx.camera.video.OutputOptions androidx.camera.video.PendingRecording androidx.camera.video.Recording \
            androidx.camera.video.VideoRecordEvent 'androidx.camera.video.VideoRecordEvent$Finalize' \
            androidx.camera.video.Quality androidx.camera.video.QualitySelector androidx.camera.video.FallbackStrategy
          api androidx/camera camera-lifecycle 1.6.2 androidx.camera.lifecycle.ProcessCameraProvider \
            'androidx.camera.lifecycle.ProcessCameraProvider$Companion'
          api androidx/camera camera-view 1.6.2 androidx.camera.view.PreviewView
          api androidx/camera camera-core 1.6.2 androidx.camera.core.Preview 'androidx.camera.core.Preview$Builder' \
            androidx.camera.core.CameraSelector androidx.camera.core.UseCaseGroup
          api com/google/firebase firebase-messaging 26.0.1 com.google.firebase.messaging.FirebaseMessagingService \
            com.google.firebase.messaging.RemoteMessage com.google.firebase.messaging.FirebaseMessaging
          v=$(curl -fsS "$base/com/google/firebase/firebase-common/maven-metadata.xml" | grep -oE '<release>[^<]+' | sed 's/<release>//')
          api com/google/firebase firebase-common "$v" com.google.firebase.FirebaseOptions 'com.google.firebase.FirebaseOptions$Builder' \
            com.google.firebase.FirebaseApp
