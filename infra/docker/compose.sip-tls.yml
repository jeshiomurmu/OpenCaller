# SIP over TLS for the recording line, the assistant and the voice scanner (docs/phase.md issue 148): a third file on
# top of compose.yml and compose.telephony.yml.
#
#   docker compose -f compose.yml -f compose.telephony.yml -f compose.sip-tls.yml up -d
#
# The SIP server listens for TLS on 5061 with the certificate at SIP_TLS_CERT_FILE / SIP_TLS_KEY_FILE (host paths, a
# certificate for SIP_DOMAIN; infra/deploy/telephony.md → Security shows how to take it from Caddy). The provider then
# connects with ";transport=tls" and the trunk requires SRTP (media.encryption). Keys from the livekit/sip v1.23.0
# config (pkg/config/config.go: tls.port, tls.certs[].cert_file/key_file, tls.min_version). The SIP server reads the
# certificate at start: restart it after a renewal (the guide's cron line does it weekly).
services:
  sip:
    environment:
      SIP_CONFIG_BODY: |
        api_key: '${LIVEKIT_API_KEY:-opencaller}'
        api_secret: '${LIVEKIT_API_SECRET}'
        ws_url: 'ws://127.0.0.1:7880'
        redis:
          address: '127.0.0.1:6379'
          password: '${REDIS_PASSWORD}'
        sip_port: 5060
        sip_hostname: '${SIP_DOMAIN}'
        rtp_port: 10000-20000
        use_external_ip: true
        health_port: 8082
        log_level: info
        tls:
          port: 5061
          min_version: tls1.2
          certs:
            - cert_file: /tls/sip.crt
              key_file: /tls/sip.key
    volumes:
      - ${SIP_TLS_CERT_FILE}:/tls/sip.crt:ro
      - ${SIP_TLS_KEY_FILE}:/tls/sip.key:ro
