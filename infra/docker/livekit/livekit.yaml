# LiveKit server for app-to-app calls (Phase 11, ADR 0007); keys from config-sample.yaml of livekit-server v1.13.11.
# The API key and secret come from LIVEKIT_KEYS and the address phones reach from NODE_IP (both set in compose.yml).
# Ports (see infra/docker/README.md for firewalls and TLS):
#   7880/tcp  signalling (WebSocket) and the server's API; put it behind a TLS proxy in production (wss://)
#   7881/tcp  ICE over TCP, for networks that block UDP
#   3478/udp  embedded TURN (UDP), for phones behind NATs that can't reach the media ports directly
#   50000-50100/udp  media (RTP); 50101-50200/udp TURN relay
port: 7880

rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50100
  # The address is given (NODE_IP), not discovered by STUN: inside Docker, discovery finds the container's address.
  use_external_ip: false

turn:
  enabled: true
  udp_port: 3478
  # TURN over TLS (port 5349 or 443) needs a domain and its certificate: see README.md. Off here, UDP only.
  tls_port: 0
  relay_range_start: 50101
  relay_range_end: 50200

room:
  # Calls are one-to-one: the caller and the callee.
  max_participants: 2
  empty_timeout: 60
  departure_timeout: 10

logging:
  level: info
