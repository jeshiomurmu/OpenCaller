# Local development stack: PostgreSQL, Redis, MinIO (S3-compatible) and the OpenCaller server.
#
#   cp infra/docker/.env.example infra/docker/.env   # then replace every value
#   docker compose -f infra/docker/compose.yml up -d --build
#   curl -fsS localhost:8080/health
#
# All ports are bound to 127.0.0.1 only. Not a production deployment (see infra/deploy, Phase 15).
name: opencaller

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in infra/docker/.env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in infra/docker/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in infra/docker/.env}
    volumes:
      # PostgreSQL 18+ images keep data under /var/lib/postgresql/<major>/docker.
      - postgres-data:/var/lib/postgresql
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:8.8
    restart: unless-stopped
    command: ["sh", "-c", "exec redis-server --requirepass \"$${REDIS_PASSWORD}\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in infra/docker/.env}
      REDISCLI_AUTH: ${REDIS_PASSWORD:?set REDIS_PASSWORD in infra/docker/.env}
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    # Chainguard's MinIO image plus a static BusyBox for the healthcheck (see minio/Dockerfile).
    build:
      context: minio
      args:
        MINIO_IMAGE: ${MINIO_IMAGE:-cgr.dev/chainguard/minio:latest}
    image: opencaller/minio:dev
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in infra/docker/.env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in infra/docker/.env}
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "/usr/local/bin/busybox", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  server:
    build:
      context: ../../backend/server
      args:
        GIT_SHA: ${GIT_SHA:-dev}
    image: opencaller/server:dev
    restart: unless-stopped
    # Configuration is read from these variables only (backend/server/src/main/resources/application.conf);
    # the server refuses to start and lists what is missing or invalid.
    environment:
      ENV: ${ENV:-development}
      PORT: "8080"
      # Prometheus /metrics: internal port, not published (docker compose exec server curl localhost:9090/metrics).
      METRICS_PORT: "9090"
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?set POSTGRES_DB in infra/docker/.env}
      DB_USER: ${POSTGRES_USER:?set POSTGRES_USER in infra/docker/.env}
      # The postgres, redis and minio services above already require these variables.
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_URL: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in infra/docker/.env}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in infra/docker/.env}
      OTP_PEPPER: ${OTP_PEPPER:?set OTP_PEPPER in infra/docker/.env}
      # log = codes are written to the server log (development only); twilio = real SMS (set TWILIO_*).
      OTP_PROVIDER: ${OTP_PROVIDER:-log}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM: ${TWILIO_FROM:-}
      TWILIO_MESSAGING_SERVICE_SID: ${TWILIO_MESSAGING_SERVICE_SID:-}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  postgres-data:
  redis-data:
  minio-data:
