# Prometheus for infra/deploy/compose.prod.yml: every target is on the internal network.
global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: opencaller-server
    static_configs:
      - targets: ["server:9090"]
  - job_name: caddy
    static_configs:
      - targets: ["caddy:2020"]
  - job_name: minio
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: ["minio:9000"]
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
