# Server configuration. Every value comes from an environment variable (docs/rules.md §2: no secrets or
# production URLs in the repo). The server refuses to start if a required variable is missing or invalid and
# lists all of them (config/AppConfig.kt). See infra/docker/.env.example for a development setup.
opencaller {
  # development | test | production
  environment = ${?ENV}
  version = "dev"
  version = ${?APP_VERSION}

  http {
    port = 8080
    port = ${?PORT}
    # Prometheus /metrics is served on this internal port only (not published by compose).
    metricsPort = 9090
    metricsPort = ${?METRICS_PORT}
  }

  database {
    url = ${?DB_URL}
    user = ${?DB_USER}
    password = ${?DB_PASSWORD}
    maxPoolSize = 10
    maxPoolSize = ${?DB_MAX_POOL_SIZE}
  }

  redis {
    # redis://host:port[/db] or rediss:// for TLS; the password goes in REDIS_PASSWORD (optional), not in the URL.
    url = ${?REDIS_URL}
    password = ${?REDIS_PASSWORD}
  }

  minio {
    endpoint = ${?MINIO_ENDPOINT}
    accessKey = ${?MINIO_ACCESS_KEY}
    secretKey = ${?MINIO_SECRET_KEY}
    # Bucket for the published spam lists (created on first upload) and the S3 signing region.
    bucket = "opencaller"
    bucket = ${?MINIO_BUCKET}
    region = "us-east-1"
    region = ${?MINIO_REGION}
    # The store's address as apps reach it, for presigned profile-picture URLs (default: endpoint).
    publicEndpoint = ${?MINIO_PUBLIC_ENDPOINT}
  }

  jwt {
    # HMAC-SHA256 key for access tokens, at least 32 characters.
    secret = ${?JWT_SECRET}
    issuer = "opencaller"
    issuer = ${?JWT_ISSUER}
    audience = "opencaller-app"
    audience = ${?JWT_AUDIENCE}
  }

  otp {
    # Server-side secret for hashing one-time codes (HMAC-SHA256), at least 32 characters.
    pepper = ${?OTP_PEPPER}
    # log (development only) | twilio
    provider = ${?OTP_PROVIDER}
  }

  twilio {
    accountSid = ${?TWILIO_ACCOUNT_SID}
    authToken = ${?TWILIO_AUTH_TOKEN}
    # One of the two: a Twilio sender (E.164 number or alphanumeric sender ID) or a Messaging Service.
    from = ${?TWILIO_FROM}
    messagingServiceSid = ${?TWILIO_MESSAGING_SERVICE_SID}
    baseUrl = "https://api.twilio.com"
    baseUrl = ${?TWILIO_BASE_URL}
    # Optional: a Twilio phone number (E.164) that calls business numbers and reads their claim code aloud.
    voiceFrom = ${?TWILIO_VOICE_FROM}
  }

  # Bayesian spam scoring (docs/architecture.md §9). priorSpam = α0, priorNotSpam = β0 (prior mean α0/(α0+β0)).
  scoring {
    intervalMinutes = 15
    intervalMinutes = ${?SCORING_INTERVAL_MINUTES}
    priorSpam = 1.0
    priorSpam = ${?SCORING_PRIOR_SPAM}
    priorNotSpam = 2.0
    priorNotSpam = ${?SCORING_PRIOR_NOT_SPAM}
    halfLifeDays = 30
    halfLifeDays = ${?SCORING_HALF_LIFE_DAYS}
    # Highest score a verified business number gets; must stay below lists.minScore.
    verifiedCap = 0.39
    verifiedCap = ${?SCORING_VERIFIED_CAP}
  }

  # Per-country spam lists (docs/architecture.md §13), built nightly at buildHourUtc and on demand.
  lists {
    buildHourUtc = 3
    buildHourUtc = ${?LIST_BUILD_HOUR_UTC}
    minScore = 0.4
    minScore = ${?LIST_MIN_SCORE}
    # A country's standard list keeps this many of its most-reported numbers; the rest form the extended list
    # (supporters only, docs/prd.md F-PR-03).
    standardMaxEntries = 200000
    standardMaxEntries = ${?LIST_STANDARD_MAX_ENTRIES}
  }

  # Bearer token for the admin endpoints on the internal metrics port (at least 32 characters). Unset = disabled.
  admin {
    token = ${?ADMIN_TOKEN}
  }

  # Admin web (claim review, OTP-source curation, sender-ID imports) on its own port; off unless ADMIN_WEB_PORT is set.
  # Then ADMIN_WEB_USER, ADMIN_WEB_PASSWORD (at least 32 characters) and ADMIN_WEB_ALLOWED_NETWORKS (comma-separated
  # CIDR blocks such as 10.0.0.0/8,203.0.113.7/32) are required. Never publish this port to the internet.
  adminWeb {
    port = ${?ADMIN_WEB_PORT}
    user = ${?ADMIN_WEB_USER}
    password = ${?ADMIN_WEB_PASSWORD}
    allowedNetworks = ${?ADMIN_WEB_ALLOWED_NETWORKS}
  }

  # Scheduled sender-ID imports: CSV extracts in IMPORT_DIR/<source>/<ISO>.csv, read daily at hourUtc. Unset = off.
  imports {
    dir = ${?IMPORT_DIR}
    hourUtc = 4
    hourUtc = ${?IMPORT_HOUR_UTC}
  }

  # Supporter tier (docs/prd.md F-UT-08). SELF_HOSTED=true unlocks every supporter feature for everyone on this
  # server. Google Play subscriptions are verified when GOOGLE_PLAY_SERVICE_ACCOUNT_FILE names a service-account key
  # (JSON) with access to the app in Play Console; then GOOGLE_PLAY_PACKAGE_NAME and BILLING_ACCOUNT_SECRET (at least
  # 32 characters, binds each purchase to its account) are required. Unset = billing off.
  billing {
    selfHosted = false
    selfHosted = ${?SELF_HOSTED}
    googlePlay {
      serviceAccountFile = ${?GOOGLE_PLAY_SERVICE_ACCOUNT_FILE}
      packageName = ${?GOOGLE_PLAY_PACKAGE_NAME}
      # The subscription's product ID; its base plan IDs start with supporter, gold or family.
      productId = "opencaller_supporter"
      productId = ${?GOOGLE_PLAY_PRODUCT_ID}
      accountSecret = ${?BILLING_ACCOUNT_SECRET}
      apiBaseUrl = "https://androidpublisher.googleapis.com"
      apiBaseUrl = ${?GOOGLE_PLAY_API_BASE_URL}
    }
  }
}
