openapi: 3.1.0
info:
  title: OpenCaller API
  version: "1"
  description: |
    OpenCaller server API v1 (docs/architecture.md §8). JSON over HTTPS.

    Errors are RFC 9457 problem details (`application/problem+json`) with a stable machine-readable `code`.
    Every response carries `X-Request-Id`; send your own (1–64 letters, digits, `-` or `_`) to correlate logs.
    Prometheus metrics (`GET /metrics`) and the admin endpoints (`POST /admin/jobs/{scoring|lists}` with
    `Authorization: Bearer <ADMIN_TOKEN>`; 409 `job_running` while a run holds the job's lock) are served on a
    separate internal port and are not part of this API; neither is the admin web (business-claim review, OTP-source
    curation, sender-ID imports), which runs on its own port behind basic auth and an IP allowlist.

    Privacy (docs/architecture.md §10): no endpoint accepts contacts, call logs or SMS bodies. Live caller ID uses
    k-anonymous buckets, so only explicit search sends a full number.
  license:
    name: GPL-3.0-only
    identifier: GPL-3.0-only

# Servers are deployment-specific; no production URL is kept in the repository (docs/rules.md §2).
servers:
  - url: http://localhost:8080
    description: Local development stack (infra/docker/compose.yml)

tags:
  - name: health
  - name: auth
    description: Phone-number sign-in (docs/architecture.md §4.7)
  - name: reports
    description: Spam / not-spam reports (docs/architecture.md §4.8)
  - name: lookup
    description: Live caller ID buckets (docs/architecture.md §4.6) and explicit search
  - name: lists
    description: Per-country spam lists (docs/architecture.md §13)
  - name: privacy
    description: Disputes and unlisting (docs/prd.md F-PR-16/17)
  - name: sync
    description: Registries apps sync incrementally
  - name: profile
    description: Own profile, visitors and contact requests (docs/prd.md §6.4, docs/decisions/0004-viewer-searcher-logging.md)
  - name: business
    description: Business claims and verified businesses (docs/prd.md §6.6)
  - name: billing
    description: Supporter tier, Play purchases and self-hosted mode (docs/prd.md F-UT-08)
  - name: voip
    description: Push endpoints, app calls, Flash messages and video caller ID (ADR 0007)

paths:
  /health:
    get:
      tags: [health]
      summary: Liveness check
      operationId: getHealth
      responses:
        "200":
          description: The server is running.
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /v1/auth/start:
    post:
      tags: [auth]
      summary: Send a sign-in code to a phone number
      description: |
        Sends a 6-digit code by SMS. The code is valid for 5 minutes and allows 5 attempts; requesting a new code
        replaces the previous one. Limits: 3 requests per hour per number and 10 per hour per client address
        (docs/rules.md §7); over the limit the response is 429 with `Retry-After`.
      operationId: startAuth
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StartRequest" }
      responses:
        "202":
          description: The code was handed to the SMS provider.
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StartResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503":
          description: "The code could not be sent (`otp_delivery_failed`). Nothing was stored; try again later."
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /v1/auth/verify:
    post:
      tags: [auth]
      summary: Exchange a code for tokens
      description: |
        Checks the code. On success the user is created (or found) for the number, a new device is registered and
        tokens are returned. A code works once. After 5 wrong attempts it is invalidated (`code_invalidated`) and a
        new one must be requested.
      operationId: verifyAuth
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VerifyRequest" }
      responses:
        "200":
          description: Signed in.
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenResponse" }
        "400":
          description: |
            `invalid_phone_number`, `invalid_code_format`, `invalid_request`, `invalid_code` (detail says how many
            attempts are left), `code_invalidated` (5 wrong attempts) or `code_expired` (no valid code: never sent,
            expired, already used or invalidated).
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }

  /v1/auth/refresh:
    post:
      tags: [auth]
      summary: Rotate the refresh token
      description: |
        Returns a new access token and a new refresh token; the presented refresh token stops working. Presenting a
        refresh token that was already rotated is treated as theft: every refresh token of that device is revoked
        (`refresh_token_reused`) and the user must sign in again.
      operationId: refreshAuth
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshRequest" }
      responses:
        "200":
          description: New tokens.
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: "`invalid_refresh_token` (unknown or expired) or `refresh_token_reused` (the device's tokens were revoked)."
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }

  /v1/reports:
    post:
      tags: [reports]
      summary: Report numbers as spam or not spam
      description: |
        A batch of 1–50 reports, stored all or nothing for the scoring job (every 15 minutes). Each number is
        validated with libphonenumber. Only the reporter's latest report on a number counts. A reporter's first
        report gives them the default trust 0.5. Limit: 100 reports per user per day (docs/rules.md §7), counted
        per report; a batch that would exceed it is refused as a whole.
      operationId: submitReports
      security: [{ accessToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReportBatch" }
      responses:
        "202":
          description: Stored.
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReportBatchResponse" }
        "400":
          description: "`invalid_phone_number` (the detail names the item, e.g. `reports[3].e164`) or `invalid_request`."
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/lookup/buckets/{cc}/{bucketId}:
    get:
      tags: [lookup]
      summary: k-anonymous live lookup bucket
      description: |
        The app computes h = SHA-256(UTF-8 bytes of the E.164 number) and sends only the country calling code and
        the first `bits` bits of h (big-endian). The response lists every number in that bucket that the server
        knows something about, with its full SHA-256 (base64) for local matching, so the server never learns which
        number was looked up. Names follow the profile's visibility: `everyone` always, `registered_only` only with
        a valid access token, `nobody` never; unlisted numbers have no name. Cache for 24 hours and revalidate with
        `If-None-Match`.
      operationId: getLookupBucket
      security: [{}, { accessToken: [] }]
      parameters:
        - { name: cc, in: path, required: true, description: "Country calling code, e.g. 880.", schema: { type: integer, minimum: 1, maximum: 999 } }
        - { name: bucketId, in: path, required: true, schema: { type: integer, minimum: 0, maximum: 65535 } }
        - { name: bits, in: query, required: false, description: "Bucket width (12–16).", schema: { type: integer, minimum: 12, maximum: 16, default: 16 } }
        - { name: If-None-Match, in: header, required: false, schema: { type: string } }
      responses:
        "200":
          description: The bucket. `Cache-Control` is `public, max-age=86400` without a token and `private, max-age=86400` with one.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            Cache-Control: { $ref: "#/components/headers/CacheControl" }
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BucketResponse" }
        "304": { $ref: "#/components/responses/NotModified" }
        "400":
          description: "`invalid_bucket`: unknown calling code, bucket out of range or bits outside 12–16."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/numbers/{e164}:
    get:
      tags: [lookup]
      summary: Explicit search
      description: |
        The user typed the number, so the full number is sent. Limit: 50 searches per user per day
        (docs/rules.md §7); the 51st gets 429 with `Retry-After`. Invalid numbers don't count. If the number
        belongs to a registered user and the searcher is not incognito, the search is recorded for that user's
        "who searched me" list (`profile_views`, kind `search`; at most once a day per searcher). An owner who
        approved the searcher's contact request shows their name whatever their visibility. Not cacheable.
      operationId: searchNumber
      security: [{ accessToken: [] }]
      parameters:
        - { name: e164, in: path, required: true, description: "E.164 number; `+` may be sent as `%2B`.", schema: { $ref: "#/components/schemas/E164" } }
      responses:
        "200":
          description: What is known about the number (empty info if nothing).
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SearchResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/lists/{countryIso}/manifest:
    get:
      tags: [lists]
      summary: Latest spam list of a country
      description: |
        The latest full list and the deltas of the last 14 versions (`baseVersion` → `version`). An app holding
        version N downloads the deltas from N on, or the full list if it is too far behind; it checks each file's
        SHA-256 against the manifest. Lists are rebuilt nightly; a country gets a new version only when its list
        changed. A country's list keeps its most-reported numbers up to a cap (`LIST_STANDARD_MAX_ENTRIES`); the rest
        is its extended list (`extended`, supporters only, docs/prd.md F-PR-03).
      operationId: getListManifest
      security: [{}, { accessToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/CountryIso" }
      responses:
        "200":
          description: "The manifest (`Cache-Control: public, max-age=300`)."
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ListManifest" }
        "304": { $ref: "#/components/responses/NotModified" }
        "400": { $ref: "#/components/responses/InvalidCountry" }
        "404": { $ref: "#/components/responses/ListNotFound" }

  /v1/lists/{countryIso}/files/{version}/{kind}:
    get:
      tags: [lists]
      summary: Download a list file
      description: |
        A list file in the binary format of docs/architecture.md §13. Files never change once published
        (`Cache-Control: public, max-age=31536000, immutable`); the ETag is the file's SHA-256. The `extended` file
        needs a supporter's access token (on a self-hosted server none) and is cached privately.
      operationId: getListFile
      security: [{}, { accessToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/CountryIso" }
        - { name: version, in: path, required: true, schema: { type: integer, minimum: 1 } }
        - { name: kind, in: path, required: true, schema: { type: string, enum: [full, delta, extended] } }
        - { name: If-None-Match, in: header, required: false, schema: { type: string } }
      responses:
        "200":
          description: The file.
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
            Cache-Control: { $ref: "#/components/headers/CacheControl" }
          content:
            application/octet-stream:
              schema: { type: string, contentMediaType: application/octet-stream }
        "304": { $ref: "#/components/responses/NotModified" }
        "400": { $ref: "#/components/responses/InvalidCountry" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/SupporterRequired" }
        "404": { $ref: "#/components/responses/ListNotFound" }

  /v1/disputes:
    post:
      tags: [privacy]
      summary: Dispute a number's spam label
      description: Queues the dispute for human review. Limit 10 per user per day.
      operationId: openDispute
      security: [{ accessToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DisputeRequest" }
      responses:
        "201":
          description: Queued.
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DisputeResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/unlist/start:
    post:
      tags: [privacy]
      summary: Start unlisting a number
      description: |
        Sends a one-time code to the number to prove the requester controls it (same limits as sign-in codes,
        counted separately: 3 per hour per number, 10 per hour per client address). Also available without the
        app as an HTML form at `/unlist`.
      operationId: startUnlist
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StartRequest" }
      responses:
        "202":
          description: The code was sent.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StartResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503":
          description: "`otp_delivery_failed`."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /v1/unlist/verify:
    post:
      tags: [privacy]
      summary: Confirm unlisting with the code
      description: |
        Stores a verified unlist request. The next scoring-job run (within 15 minutes) processes it; from then on
        lookups and search show no name for the number. Its spam score and reports stay.
      operationId: verifyUnlist
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UnlistVerifyRequest" }
      responses:
        "202":
          description: Verified.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UnlistVerifyResponse" }
        "400":
          description: "`invalid_phone_number`, `invalid_code_format`, `invalid_code`, `code_invalidated` or `code_expired`."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }

  /unlist:
    get:
      tags: [privacy]
      summary: Unlist form (HTML)
      description: Server-rendered page for people without the app; no JavaScript. Step 1 asks for the number.
      operationId: unlistForm
      responses:
        "200":
          description: The form.
          content:
            text/html: { schema: { type: string } }
    post:
      tags: [privacy]
      summary: Unlist form, step 1 submitted (HTML)
      description: Sends the code (as `/v1/unlist/start`) and shows the code form, or the number form with the error.
      operationId: unlistFormNumber
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [e164]
              properties:
                e164: { type: string, maxLength: 64, description: International format; spaces and dashes allowed. }
      responses:
        "200":
          description: The code form.
          content:
            text/html: { schema: { type: string } }
        "4XX":
          description: The number form with the error shown.
          content:
            text/html: { schema: { type: string } }

  /unlist/verify:
    post:
      tags: [privacy]
      summary: Unlist form, step 2 submitted (HTML)
      description: Checks the code (as `/v1/unlist/verify`) and shows the confirmation, or the form with the error.
      operationId: unlistFormVerify
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [e164, code]
              properties:
                e164: { type: string, maxLength: 64 }
                code: { type: string, pattern: '^[0-9]{6}$' }
      responses:
        "200":
          description: Confirmation page.
          content:
            text/html: { schema: { type: string } }
        "4XX":
          description: The form with the error shown.
          content:
            text/html: { schema: { type: string } }

  /v1/sender-ids/{countryIso}:
    get:
      tags: [sync]
      summary: SMS sender-ID registry of a country
      description: |
        Rows updated after `since` (epoch milliseconds), oldest first, at most 5,000; pass the returned `syncedAt`
        as `since` next time. Removed rows come once more with `deleted: true`. Filled by the sender-ID importers
        (CSV extracts); `backend/server/seed/sender_ids.csv` adds example rows on first start.
      operationId: getSenderIds
      parameters:
        - { $ref: "#/components/parameters/CountryIso" }
        - { $ref: "#/components/parameters/Since" }
      responses:
        "200":
          description: "Sender IDs (`Cache-Control: public, max-age=3600`)."
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SenderIdsResponse" }
        "304": { $ref: "#/components/responses/NotModified" }
        "400": { $ref: "#/components/responses/InvalidCountry" }

  /v1/otp-sources:
    get:
      tags: [sync]
      summary: OTP sources (SMS Retriever app hashes and flash-call ranges)
      description: |
        Entries updated after `since` (epoch milliseconds), removed ones with `deleted: true`. Curated in the admin
        web; `backend/server/seed/` adds example rows on first start.
      operationId: getOtpSources
      parameters:
        - { $ref: "#/components/parameters/Since" }
      responses:
        "200":
          description: "OTP sources (`Cache-Control: public, max-age=3600`)."
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OtpSourcesResponse" }
        "304": { $ref: "#/components/responses/NotModified" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /v1/link-prefixes:
    get:
      tags: [sync]
      summary: Known-bad link hosts as hash prefixes
      description: |
        The whole list on every call (it is small), so hosts taken off the list disappear on the next sync. Each
        prefix is the first 4 bytes of SHA-256 over a host's lower-case ASCII (IDNA) form, as 8 hex digits; the app
        flags a link whose host or parent domain has a listed prefix. Host names are never served. Seeded from
        `backend/server/seed/bad_hosts.csv` (example rows only until Phase 9).
      operationId: getLinkPrefixes
      responses:
        "200":
          description: "Prefixes (`Cache-Control: public, max-age=3600`)."
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LinkPrefixesResponse" }
        "304": { $ref: "#/components/responses/NotModified" }

  /v1/me:
    get:
      tags: [profile]
      summary: Own profile
      description: |
        The signed-in user's profile, supporter badge, and how many views and searches (last 90 days) and pending
        contact requests they have. `avatarUrl` is a presigned download link valid 15 minutes. 401 if the account
        was deleted after the token was issued. `Cache-Control: no-store`.
      operationId: getMe
      security: [{ accessToken: [] }]
      responses:
        "200":
          description: The profile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MeResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      tags: [profile]
      summary: Replace own profile
      description: |
        Send every field: `displayName` (1–60 characters on one line, or null), `visibility` (who sees the name in
        caller ID and search: `everyone`, `registered_only` = signed-in users, `nobody`), `incognito` (your views
        and searches aren't recorded in others' lists) and `avatarKey` (the current key, one from
        `POST /v1/me/avatar` whose upload finished, or null to remove the picture). A new picture must be a JPEG of
        at most 1,000,000 bytes; a replaced or removed picture is deleted. Changes show in lookups at once.
      operationId: putMe
      security: [{ accessToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateMeRequest" }
      responses:
        "200":
          description: The updated profile.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MeResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      tags: [profile]
      summary: Delete the account
      description: |
        At once: the profile is out of every lookup, search and profile answer, every device is signed out, and the
        views and contact requests involving the account are deleted. The daily retention job then deletes the
        reports the user wrote (their numbers are rescored), the picture and the account row, within a day (the
        PRD allows 30). Signing in again later starts a new, empty account.
      operationId: deleteMe
      security: [{ accessToken: [] }]
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/me/avatar:
    post:
      tags: [profile]
      summary: Upload URL for a profile picture
      description: |
        A presigned `PUT` URL valid 10 minutes, under a key for this user. Upload the JPEG to it with
        `Content-Type: image/jpeg` (signed; no access token), then set `avatarKey` with `PUT /v1/me`.
      operationId: postAvatar
      security: [{ accessToken: [] }]
      responses:
        "200":
          description: Where and how to upload.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AvatarUploadResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/me/viewers:
    get:
      tags: [profile]
      summary: Who viewed my profile (supporters)
      description: |
        Profile views of the last 90 days, newest first (at most 200 listed; `total` counts all). Views by incognito
        users, of your own profile and repeats within 24 hours are never recorded. A viewer's name shows only if
        their own visibility lets signed-in users see it; their number is never shown. 403 `supporter_required`
        for non-supporters (see `/v1/entitlements`).
      operationId: getViewers
      security: [{ accessToken: [] }]
      responses:
        "200":
          description: The viewers.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VisitorsResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/SupporterRequired" }

  /v1/me/searchers:
    get:
      tags: [profile]
      summary: Who searched for me (supporters)
      description: Like `/v1/me/viewers`, for searches of your number (`GET /v1/numbers/{e164}`).
      operationId: getSearchers
      security: [{ accessToken: [] }]
      responses:
        "200":
          description: The searchers.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VisitorsResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/SupporterRequired" }

  /v1/profiles/{e164}:
    get:
      tags: [profile]
      summary: Open a profile
      description: |
        What the signed-in user may see of the number's profile: the name (by the owner's visibility, or because
        the owner approved their contact request), and with a name the supporter badge and a picture URL valid
        15 minutes. The answer has the same shape for unregistered numbers. Recorded as a view in the owner's
        "who viewed my profile" list unless the viewer is incognito. 100 per user per day.
      operationId: getProfile
      security: [{ accessToken: [] }]
      parameters:
        - { name: e164, in: path, required: true, description: "E.164 number; `+` may be sent as `%2B`.", schema: { $ref: "#/components/schemas/E164" } }
      responses:
        "200":
          description: The profile as this user may see it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicProfileResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/contact-requests:
    post:
      tags: [profile]
      summary: Ask for a hidden profile's name
      description: |
        Always 202 `{"status":"sent"}` for a valid number, whether it has a profile, a hidden name, an earlier
        request or a denial, so requests reveal neither who is registered nor what an owner decided. Only owners
        with visibility `nobody` receive the request; they see the requester's number and name. If they approve,
        search and profile show the requester their name. A denied requester may ask again after 30 days. 20 per
        user per day.
      operationId: postContactRequest
      security: [{ accessToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ContactRequestBody" }
      responses:
        "202":
          description: Sent (or nothing to send; the answer is the same).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContactRequestSent" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }
    get:
      tags: [profile]
      summary: Pending requests to me
      description: Requests waiting for the signed-in user's answer, newest first (at most 200).
      operationId: getContactRequests
      security: [{ accessToken: [] }]
      responses:
        "200":
          description: The pending requests.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IncomingContactRequests" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/contact-requests/{id}/approve:
    post:
      tags: [profile]
      summary: Approve a contact request
      operationId: approveContactRequest
      security: [{ accessToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/ContactRequestId" }
      responses:
        "200":
          description: Approved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContactRequestDecision" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/ContactRequestNotFound" }

  /v1/contact-requests/{id}/deny:
    post:
      tags: [profile]
      summary: Deny a contact request
      description: The requester isn't told; their requests keep getting the same answer.
      operationId: denyContactRequest
      security: [{ accessToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/ContactRequestId" }
      responses:
        "200":
          description: Denied.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContactRequestDecision" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/ContactRequestNotFound" }

  /v1/business/claims:
    post:
      tags: [business]
      summary: Claim a business number
      description: |
        Starts a claim: a 6-digit code goes to the claimed number by SMS (`method: sms`) or is read aloud in a phone
        call (`method: voice`, for landlines; 400 if the server has no voice sender). Prove control with
        `POST …/code`, then upload documents and submit. One claim in progress per number. Limits: 5 claims a day
        per user, 3 codes an hour per number. The number and the business's name are published once approved.
      operationId: startClaim
      security: [{ accessToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StartClaimRequest" }
      responses:
        "201":
          description: Claim started (`status` verifying); `codeExpiresInSeconds` is set.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClaimResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/ClaimConflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503":
          description: "`otp_delivery_failed`: the code could not be sent; nothing was stored."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
    get:
      tags: [business]
      summary: My business claims
      description: The signed-in user's claims, newest first (at most 50). A rejected claim carries the reviewer's note.
      operationId: getClaims
      security: [{ accessToken: [] }]
      responses:
        "200":
          description: The claims.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClaimsResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/business/claims/{id}:
    delete:
      tags: [business]
      summary: Withdraw a claim
      description: Withdraws a claim in progress; its uploaded files are deleted at once.
      operationId: withdrawClaim
      security: [{ accessToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/ClaimId" }
      responses:
        "204": { description: Withdrawn. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/ClaimNotFound" }
        "409": { $ref: "#/components/responses/ClaimConflict" }

  /v1/business/claims/{id}/code:
    post:
      tags: [business]
      summary: Prove control of the claimed number
      description: The code sent to the number; 5 wrong tries invalidate it. The right code moves the claim to `verified`.
      operationId: verifyClaimCode
      security: [{ accessToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/ClaimId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClaimCodeRequest" }
      responses:
        "200":
          description: The claim, now `verified`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClaimResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/ClaimNotFound" }
        "409": { $ref: "#/components/responses/ClaimConflict" }

  /v1/business/claims/{id}/resend:
    post:
      tags: [business]
      summary: Send a new code
      description: Replaces the pending code, by SMS or phone call (counts against the 3 codes an hour per number).
      operationId: resendClaimCode
      security: [{ accessToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/ClaimId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ResendCodeRequest" }
      responses:
        "200":
          description: The claim; `codeExpiresInSeconds` is set.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClaimResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/ClaimNotFound" }
        "409": { $ref: "#/components/responses/ClaimConflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503":
          description: "`otp_delivery_failed`."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /v1/business/claims/{id}/uploads:
    post:
      tags: [business]
      summary: Upload URL for a claim document or logo
      description: |
        Only once the number is proven (403 `number_not_verified` before; TC-BIZ-001). A presigned `PUT` URL valid
        10 minutes: upload the file with the given `Content-Type` (signed; no access token). Documents: PDF, JPEG or
        PNG up to 10 MB, at most 5 per claim; logo: PNG or JPEG up to 200 KB. A claim gets at most 20 upload URLs.
      operationId: claimUpload
      security: [{ accessToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/ClaimId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ClaimUploadRequest" }
      responses:
        "200":
          description: Where and how to upload.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClaimUploadResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/NumberNotVerified" }
        "404": { $ref: "#/components/responses/ClaimNotFound" }
        "409": { $ref: "#/components/responses/ClaimConflict" }

  /v1/business/claims/{id}/submit:
    post:
      tags: [business]
      summary: Submit a claim for review
      description: |
        Only once the number is proven (403 `number_not_verified` before; TC-BIZ-001). Each named upload is checked
        (it exists, was issued for this claim, has the signed type and fits the size limit). The claim moves to
        `submitted` and waits for a reviewer.
      operationId: submitClaim
      security: [{ accessToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/ClaimId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubmitClaimRequest" }
      responses:
        "200":
          description: The claim, now `submitted`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ClaimResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/NumberNotVerified" }
        "404": { $ref: "#/components/responses/ClaimNotFound" }
        "409": { $ref: "#/components/responses/ClaimConflict" }

  /v1/server:
    get:
      tags: [billing]
      summary: What this server offers
      description: Whether it is self-hosted (every supporter feature unlocked for everyone) and which Play product it verifies.
      operationId: getServerInfo
      responses:
        "200":
          description: "Server info (`Cache-Control: no-store`)."
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerInfo" }

  /v1/entitlements:
    get:
      tags: [billing]
      summary: The signed-in user's supporter status
      description: |
        `entitled` unlocks supporter features. `billingAccountId` (while Play billing is configured) is the
        obfuscated account ID the app passes to Google Play with a purchase, which binds it to this account.
      operationId: getEntitlements
      security: [{ accessToken: [] }]
      responses:
        "200":
          description: "Entitlements (`Cache-Control: no-store`)."
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Entitlements" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/billing/verify:
    post:
      tags: [billing]
      summary: Verify a Google Play purchase of the supporter subscription
      description: |
        The server asks Google (`purchases.subscriptionsv2.get`) about the token, checks the product, the base plan
        (its ID starts with `supporter`, `gold` or `family`) and that the purchase carries this account's
        `billingAccountId`, stores it, acknowledges it and sets the user's tier. Sending a purchase again is
        harmless; an expired purchase never replaces one that still gives access. Limit 30 per user per hour.
      operationId: verifyPurchase
      security: [{ accessToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VerifyPurchaseRequest" }
      responses:
        "200":
          description: "The user's entitlements after the check (`Cache-Control: no-store`)."
          headers:
            X-Request-Id: { $ref: "#/components/headers/RequestId" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Entitlements" }
        "400":
          description: "`invalid_purchase` (Google doesn't know the token) or `unknown_product`."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: "`purchase_other_account`: the purchase belongs to another account."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "415": { $ref: "#/components/responses/UnsupportedMediaType" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502":
          description: "`billing_unavailable`: Google Play couldn't be reached."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        "503":
          description: "`billing_not_configured`: this server has no Play billing."
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /v1/business/{id}:
    get:
      tags: [business]
      summary: A verified business's profile
      description: Name, category, website, hours, logo and numbers with their call reasons. 404 for anything not verified.
      operationId: getBusiness
      parameters:
        - { $ref: "#/components/parameters/BusinessId" }
      responses:
        "200":
          description: "The profile (`Cache-Control: public, max-age=3600`)."
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BusinessProfileResponse" }
        "304": { $ref: "#/components/responses/NotModified" }
        "404": { $ref: "#/components/responses/BusinessNotFound" }

  /v1/business/{id}/logo:
    get:
      tags: [business]
      summary: A verified business's logo
      operationId: getBusinessLogo
      parameters:
        - { $ref: "#/components/parameters/BusinessId" }
      responses:
        "200":
          description: "The logo (`Cache-Control: public, max-age=86400`)."
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
        "304": { $ref: "#/components/responses/NotModified" }
        "404": { $ref: "#/components/responses/BusinessNotFound" }

  /v1/businesses/{countryIso}:
    get:
      tags: [business]
      summary: Directory of verified business numbers of a country
      description: |
        Business numbers changed after `since` (epoch milliseconds), oldest first, at most 5,000; pass the returned
        `syncedAt` as `since` next time. A number whose business was revoked comes once more with `removed: true`.
        Apps keep the directory on the phone, so verified businesses are known before any lookup and offline.
      operationId: getBusinessDirectory
      parameters:
        - { $ref: "#/components/parameters/CountryIso" }
        - { $ref: "#/components/parameters/Since" }
      responses:
        "200":
          description: "Entries (`Cache-Control: public, max-age=3600`)."
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DirectoryResponse" }
        "304": { $ref: "#/components/responses/NotModified" }
        "400": { $ref: "#/components/responses/InvalidCountry" }

  /v1/push:
    put:
      tags: [voip]
      summary: Set this device's push endpoint
      description: |
        `fcm` (play builds) with the FCM registration `token`, or `webpush` (UnifiedPush, foss builds) with the
        distributor's `endpoint` and the app's `p256dh` / `auth` keys (base64url; RFC 8291). Pushes carry only a
        random id (ADR 0007). In production a Web Push endpoint must be https on a public address.
      operationId: putPushEndpoint
      security: [{ accessToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PushRegistration" }
      responses:
        "204": { description: Stored. }
        "400": { description: "`invalid_push_endpoint` or `invalid_request`.", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: "`device_not_found`: the token's device is gone.", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
    delete:
      tags: [voip]
      summary: Remove this device's push endpoint
      operationId: deletePushEndpoint
      security: [{ accessToken: [] }]
      responses:
        "204": { description: Removed. }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/notifications:
    get:
      tags: [voip]
      summary: Unexpired items behind pushes
      description: For a phone whose push didn't arrive. Flash messages already fetched are left out.
      operationId: listNotifications
      security: [{ accessToken: [] }]
      responses:
        "200":
          description: "Newest first, at most 50 (`Cache-Control: no-store`)."
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Notification" } }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/notifications/{id}:
    get:
      tags: [voip]
      summary: The item a push stood for
      description: A push carries only this id. Fetching a Flash message deletes it from the server.
      operationId: getNotification
      security: [{ accessToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/ItemId" }
      responses:
        "200":
          description: "The item (`Cache-Control: no-store`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Notification" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: "`notification_not_found` (expired, fetched, or not this user's) or `not_found`.", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }

  /v1/voip/calls:
    post:
      tags: [voip]
      summary: Start an app call
      description: |
        Creates an invite that rings for 45 seconds, pushes its id to the callee's phones and returns a LiveKit
        token for a room named after the sorted pair of user IDs plus a random nonce. Limit 30 per user per hour.
      operationId: startCall
      security: [{ accessToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StartCallRequest" }
      responses:
        "200":
          description: "The call (`Cache-Control: no-store`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CallSession" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: "`not_reachable`: no OpenCaller user with a push endpoint who accepts app calls and Flash messages has this number (the same answer whatever the reason).", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { description: "`voip_unavailable`: this server has no LiveKit or no push provider.", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }

  /v1/voip/calls/{id}:
    get:
      tags: [voip]
      summary: An app call as one of its parties sees it
      operationId: getCall
      security: [{ accessToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/ItemId" }
      responses:
        "200":
          description: "The call (`Cache-Control: no-store`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CallInvite" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: "`call_not_found` or `not_found`.", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }

  /v1/voip/calls/{id}/{action}:
    post:
      tags: [voip]
      summary: Accept, decline, cancel or end an app call
      description: The callee accepts or declines, the caller cancels; either ends an accepted call. The other party gets a push.
      operationId: actOnCall
      security: [{ accessToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/ItemId" }
        - { name: action, in: path, required: true, schema: { type: string, enum: [accept, decline, cancel, end] } }
      responses:
        "200":
          description: "The call after the action (`Cache-Control: no-store`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CallInvite" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: "`call_not_found` or `not_found` (also for an unknown action).", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "409": { description: "`call_state`: not allowed in the call's state or for this party.", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }

  /v1/voip/token:
    post:
      tags: [voip]
      summary: A LiveKit token for a call's room
      description: While the call rings or is answered. Valid 10 minutes by default; audio only.
      operationId: getRoomToken
      security: [{ accessToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoomTokenRequest" }
      responses:
        "200":
          description: "The token (`Cache-Control: no-store`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoomToken" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: "`call_not_found` or `not_found`.", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "409": { description: "`call_state`: the call is over.", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "503": { description: "`voip_unavailable`.", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }

  /v1/voip/settings:
    get:
      tags: [voip]
      summary: Whether app calls and Flash messages can reach this user
      operationId: getVoipSettings
      security: [{ accessToken: [] }]
      responses:
        "200":
          description: "On by default (`Cache-Control: no-store`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VoipSettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      tags: [voip]
      summary: Turn reachability on or off
      operationId: putVoipSettings
      security: [{ accessToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VoipSettings" }
      responses:
        "200":
          description: "Stored (`Cache-Control: no-store`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VoipSettings" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/flash:
    post:
      tags: [voip]
      summary: Send a Flash message
      description: |
        A predefined ping (no free text, no location). It waits on the server until the recipient's phone fetches it,
        at most a day. Limits: 60 per sender and 10 per pair per hour.
      operationId: sendFlash
      security: [{ accessToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SendFlashRequest" }
      responses:
        "200":
          description: "Sent (`Cache-Control: no-store`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FlashSent" }
        "400": { description: "`invalid_flash`, `invalid_phone_number` or `invalid_request`.", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: "`not_reachable`: no OpenCaller user with a push endpoint who accepts app calls and Flash messages has this number (the same answer whatever the reason).", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "429": { $ref: "#/components/responses/RateLimited" }
        "503": { description: "`flash_unavailable`: this server has no push provider.", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }

  /v1/me/video:
    get:
      tags: [voip]
      summary: My video caller ID and upload state
      operationId: getMyVideo
      security: [{ accessToken: [] }]
      responses:
        "200":
          description: "`Cache-Control: no-store`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MyVideo" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [voip]
      summary: Submit an uploaded clip for transcoding
      description: The transcoder cuts it to 10 s, 480 px, no sound, and publishes it under a new random id.
      operationId: submitVideo
      security: [{ accessToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SubmitVideoRequest" }
      responses:
        "200":
          description: "Queued (`Cache-Control: no-store`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MyVideo" }
        "400": { description: "`invalid_video`: unknown key, not uploaded, not `video/mp4` or over 20 MiB.", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
    delete:
      tags: [voip]
      summary: Delete my video caller ID
      operationId: deleteMyVideo
      security: [{ accessToken: [] }]
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /v1/me/video/upload:
    post:
      tags: [voip]
      summary: A pre-signed URL to upload a new clip
      description: The current clip stays visible until the new one is published. Limit 10 per user per day.
      operationId: createVideoUpload
      security: [{ accessToken: [] }]
      responses:
        "200":
          description: "`PUT` the MP4 to `uploadUrl` with `Content-Type: video/mp4` (`Cache-Control: no-store`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VideoUpload" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/videos/links:
    post:
      tags: [voip]
      summary: Download links for clips
      description: |
        For clip ids from bucket entries (`NumberInfo.videoId`) or a call invite. No sign-in, so a phone can fetch the
        clips of a whole bucket without saying which number rang. Unknown, hidden or malformed ids are left out.
        Limit 240 per client address per hour.
      operationId: getVideoLinks
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VideoLinksRequest" }
      responses:
        "200":
          description: "Links valid 15 minutes (`Cache-Control: no-store`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VideoLinks" }
        "400": { description: "`invalid_video`: 1 to 64 ids.", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "429": { $ref: "#/components/responses/RateLimited" }

  /v1/videos/{id}/report:
    post:
      tags: [voip]
      summary: Report a clip
      description: A clip reported by three users is hidden.
      operationId: reportVideo
      security: [{ accessToken: [] }]
      parameters:
        - { $ref: "#/components/parameters/ItemId" }
      responses:
        "204": { description: Recorded. }
        "400": { description: "`invalid_video`: your own clip.", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: "`video_not_found` or `not_found`.", content: { application/problem+json: { schema: { $ref: "#/components/schemas/Problem" } } } }
        "429": { $ref: "#/components/responses/RateLimited" }

components:
  securitySchemes:
    accessToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Access token from verify/refresh, valid 15 minutes (`sub` = user ID, `did` = device ID). Endpoints that need
        it answer 401 `unauthorized` without a valid token. Where it is optional, a token that is sent must be valid.

  headers:
    RequestId:
      description: Request ID (yours if you sent a valid `X-Request-Id`, otherwise a generated UUID). Logged with the request.
      schema: { type: string, maxLength: 64 }
    RetryAfter:
      description: Seconds until the rate-limit window resets.
      schema: { type: integer, minimum: 1 }
    ETag:
      description: Strong validator; send it back in `If-None-Match` to get 304 when nothing changed.
      schema: { type: string }
    CacheControl:
      description: How long the response may be cached.
      schema: { type: string }

  parameters:
    ItemId:
      name: id
      in: path
      required: true
      description: A UUID; anything else is 404 `not_found`.
      schema: { type: string, format: uuid }
    CountryIso:
      name: countryIso
      in: path
      required: true
      description: ISO 3166-1 alpha-2 region code (case-insensitive), e.g. BD.
      schema: { type: string, pattern: '^[A-Za-z]{2}$' }
    Since:
      name: since
      in: query
      required: false
      description: Epoch milliseconds; only entries updated later are returned. Omit for everything.
      schema: { type: integer, minimum: 0, default: 0 }
    ClaimId:
      name: id
      in: path
      required: true
      description: Claim ID from `POST /v1/business/claims`.
      schema: { type: string, format: uuid }
    BusinessId:
      name: id
      in: path
      required: true
      description: Business ID (`businessId` in lookups, search and the directory).
      schema: { type: string, format: uuid }
    ContactRequestId:
      name: id
      in: path
      required: true
      description: Request ID from `GET /v1/contact-requests`.
      schema: { type: integer }

  responses:
    BadRequest:
      description: "`invalid_request` (unreadable JSON or missing fields) or `invalid_phone_number`."
      headers:
        X-Request-Id: { $ref: "#/components/headers/RequestId" }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    PayloadTooLarge:
      description: "`payload_too_large`: the body is larger than 64 KiB."
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    UnsupportedMediaType:
      description: "`unsupported_media_type`: send `application/json`."
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unauthorized:
      description: "`unauthorized`: missing, invalid or expired access token."
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotModified:
      description: Not modified (the `If-None-Match` ETag is current); no body.
      headers:
        ETag: { $ref: "#/components/headers/ETag" }
    InvalidCountry:
      description: "`invalid_country`: not an ISO 3166-1 alpha-2 code libphonenumber knows."
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    ListNotFound:
      description: "`list_not_found`: no list published for this country (or no such file)."
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    SupporterRequired:
      description: "`supporter_required`: a supporter feature."
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    ContactRequestNotFound:
      description: "`not_found`: no pending request with this ID to the signed-in user."
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    ClaimNotFound:
      description: "`claim_not_found`: no such claim of the signed-in user."
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    ClaimConflict:
      description: |
        `claim_open` (the number has a claim in progress), `already_verified` (it belongs to a verified business)
        or `claim_state` (the claim isn't at this step).
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NumberNotVerified:
      description: "`number_not_verified`: prove control of the number with its code first (TC-BIZ-001)."
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    BusinessNotFound:
      description: "`business_not_found`: no verified business with this ID (or it has no logo)."
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    RateLimited:
      description: "`rate_limited`: too many requests; wait `Retry-After` seconds."
      headers:
        Retry-After: { $ref: "#/components/headers/RetryAfter" }
        X-Request-Id: { $ref: "#/components/headers/RequestId" }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    E164:
      type: string
      description: Phone number in E.164 (`+`, country code, number; no spaces). Must be a valid number.
      pattern: '^\+[1-9][0-9]{6,14}$'
      examples: ["+14155552671"]

    Health:
      type: object
      required: [status, version]
      properties:
        status: { type: string, const: ok }
        version: { type: string, description: Git SHA of the build or `dev`. }

    StartRequest:
      type: object
      required: [e164]
      properties:
        e164: { $ref: "#/components/schemas/E164" }

    StartResponse:
      type: object
      required: [expiresInSeconds]
      properties:
        expiresInSeconds: { type: integer, const: 300 }

    VerifyRequest:
      type: object
      required: [e164, code]
      properties:
        e164: { $ref: "#/components/schemas/E164" }
        code: { type: string, pattern: '^[0-9]{6}$' }
        integrityToken:
          type: string
          maxLength: 4096
          description: Play Integrity token (play flavor). Accepted now; verified in a later phase.
        flavor:
          type: string
          enum: [foss, play, unknown]
          default: unknown
          description: App build flavor, stored with the device.

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string, minLength: 1, maxLength: 128 }

    TokenResponse:
      type: object
      required: [accessToken, accessTokenExpiresIn, refreshToken, refreshTokenExpiresIn, tokenType]
      properties:
        accessToken: { type: string, description: JWT (HS256). }
        accessTokenExpiresIn: { type: integer, description: Seconds (900). }
        refreshToken: { type: string, description: Opaque; store encrypted (Android Keystore). Rotates on every refresh. }
        refreshTokenExpiresIn: { type: integer, description: "Seconds (2,592,000 = 30 days)." }
        tokenType: { type: string, const: Bearer }

    ReportItem:
      type: object
      required: [e164, label]
      properties:
        e164: { $ref: "#/components/schemas/E164" }
        label: { type: string, enum: [spam, not_spam] }
        category:
          type: string
          description: Spam reports only.
          enum: [scam, fraud, telemarketing, loan, debt_collector, robocall, survey, political, charity, nuisance, other]
        comment: { type: string, maxLength: 280, description: Plain text; trimmed. }

    ReportBatch:
      type: object
      required: [reports]
      properties:
        reports:
          type: array
          minItems: 1
          maxItems: 50
          items: { $ref: "#/components/schemas/ReportItem" }

    ReportBatchResponse:
      type: object
      required: [accepted]
      properties:
        accepted: { type: integer }

    BusinessInfo:
      type: object
      required: [name, verified]
      properties:
        name: { type: string }
        category: { type: [string, "null"] }
        verified: { type: boolean, const: true }
        callReason: { type: [string, "null"] }
        businessId: { type: [string, "null"], format: uuid }
        logoUrl: { type: [string, "null"], description: "API path of the logo (`/v1/business/{id}/logo`)." }

    NumberInfo:
      type: object
      description: |
        `spamScore` (0–1, three decimals), `label` and `category` are null when the number has no reports.
        `label` is `likely_spam` from 0.85 and `suspicious` from 0.6 (docs/architecture.md §9). `badge` is the
        owner's supporter badge and is only set next to a `name`.
      required: [reportCount, notSpamCount]
      properties:
        name: { type: [string, "null"] }
        badge: { type: [string, "null"], enum: [supporter, gold, null] }
        spamScore: { type: [number, "null"], minimum: 0, maximum: 1 }
        label: { type: [string, "null"], enum: [likely_spam, suspicious, null] }
        category: { type: [string, "null"] }
        reportCount: { type: integer, description: Spam reports (one per reporter). }
        notSpamCount: { type: integer, description: Not-spam reports (one per reporter). }
        lineType: { type: [string, "null"] }
        business:
          oneOf:
            - { $ref: "#/components/schemas/BusinessInfo" }
            - { type: "null" }
        videoId:
          type: [string, "null"]
          format: uuid
          description: The owner's video caller ID, as visible as `name` (fetch it with `POST /v1/videos/links`).

    BucketEntry:
      type: object
      required: [hash, info]
      properties:
        hash: { type: string, contentEncoding: base64, description: Full SHA-256 of the E.164 number (32 bytes). }
        info: { $ref: "#/components/schemas/NumberInfo" }

    BucketResponse:
      type: object
      required: [countryCode, bucket, bits, entries]
      properties:
        countryCode: { type: integer }
        bucket: { type: integer }
        bits: { type: integer }
        entries:
          type: array
          description: Sorted by hash.
          items: { $ref: "#/components/schemas/BucketEntry" }

    SearchResponse:
      type: object
      required: [e164, info]
      properties:
        e164: { $ref: "#/components/schemas/E164" }
        info: { $ref: "#/components/schemas/NumberInfo" }

    ListFileRef:
      type: object
      required: [version, url, sha256, createdAt]
      properties:
        version: { type: integer }
        baseVersion: { type: [integer, "null"], description: "Deltas: the version this delta applies to (version − 1)." }
        url: { type: string, description: Path on this server. }
        sha256: { type: string, pattern: '^[0-9a-f]{64}$', description: SHA-256 of the whole file. }
        createdAt: { type: string, format: date-time }

    ListManifest:
      type: object
      required: [countryIso, format, version, full, deltas]
      properties:
        countryIso: { type: string }
        format: { type: integer, const: 1, description: List file format revision (docs/architecture.md §13). }
        version: { type: integer }
        full: { $ref: "#/components/schemas/ListFileRef" }
        deltas:
          type: array
          description: Newest first.
          items: { $ref: "#/components/schemas/ListFileRef" }
        extended:
          $ref: "#/components/schemas/ListFileRef"
          description: The extended list of `version` (supporters only); absent when there is none.

    ServerInfo:
      type: object
      required: [selfHosted, billing]
      properties:
        selfHosted: { type: boolean }
        billing:
          type: object
          properties:
            googlePlayProductId: { type: string, description: Set while Play billing is configured. }
        features:
          type: object
          required: [appCalls, flash, fcm]
          properties:
            appCalls: { type: boolean, description: LiveKit and a push provider are configured. }
            flash: { type: boolean, description: A push provider is configured. }
            fcm: { type: boolean, description: FCM is configured (play builds register FCM tokens). }
            webPushVapidKey: { type: string, description: "VAPID public key (87 characters, base64url) for UnifiedPush registration." }

    Entitlements:
      type: object
      required: [entitled, tier, source, autoRenewing]
      properties:
        entitled: { type: boolean }
        tier: { type: string, enum: [none, supporter, gold, family] }
        source: { type: string, enum: [none, billing, granted, self_hosted] }
        expiresAt: { type: string, format: date-time, description: End of the paid period of an active purchase. }
        autoRenewing: { type: boolean }
        billingAccountId: { type: string, minLength: 64, maxLength: 64 }

    VerifyPurchaseRequest:
      type: object
      required: [productId, purchaseToken]
      properties:
        productId: { type: string }
        purchaseToken: { type: string, minLength: 1, maxLength: 2048 }

    DisputeRequest:
      type: object
      required: [e164, reason]
      properties:
        e164: { $ref: "#/components/schemas/E164" }
        reason: { type: string, minLength: 1, maxLength: 1000 }

    DisputeResponse:
      type: object
      required: [id, status]
      properties:
        id: { type: integer }
        status: { type: string, const: pending }

    UnlistVerifyRequest:
      type: object
      required: [e164, code]
      properties:
        e164: { $ref: "#/components/schemas/E164" }
        code: { type: string, pattern: '^[0-9]{6}$' }

    UnlistVerifyResponse:
      type: object
      required: [status, processedWithinMinutes]
      properties:
        status: { type: string, const: verified }
        processedWithinMinutes: { type: integer }

    SenderId:
      type: object
      required: [header, brandName, category, source, updatedAt]
      properties:
        header: { type: string }
        brandName: { type: string }
        category: { type: string }
        source: { type: string }
        businessId: { type: [string, "null"], format: uuid }
        updatedAt: { type: integer, description: Epoch milliseconds. }
        deleted: { type: boolean, default: false, description: The row was removed; apps delete it. }

    SenderIdsResponse:
      type: object
      required: [countryIso, syncedAt, senderIds]
      properties:
        countryIso: { type: string }
        syncedAt: { type: integer, description: Pass as `since` next time. }
        senderIds: { type: array, items: { $ref: "#/components/schemas/SenderId" } }

    OtpSourcesResponse:
      type: object
      required: [syncedAt, appHashes, verificationRanges]
      properties:
        syncedAt: { type: integer }
        appHashes:
          type: array
          items:
            type: object
            required: [hash, packageName, appName, updatedAt]
            properties:
              hash: { type: string, description: 11-character SMS Retriever app hash. }
              packageName: { type: string }
              appName: { type: string }
              updatedAt: { type: integer }
              deleted: { type: boolean, default: false }
        verificationRanges:
          type: array
          items:
            type: object
            required: [prefix, provider, updatedAt]
            properties:
              prefix: { type: string, description: E.164 prefix used by a flash-call provider. }
              provider: { type: string }
              updatedAt: { type: integer }
              deleted: { type: boolean, default: false }

    LinkPrefixesResponse:
      type: object
      required: [syncedAt, prefixes]
      properties:
        syncedAt: { type: integer, description: Newest change to the list (epoch milliseconds). }
        prefixes:
          type: array
          description: Sorted, distinct.
          items: { type: string, pattern: "^[0-9a-f]{8}$" }

    MeResponse:
      type: object
      required: [e164, visibility, incognito, supporter, viewerCount, searcherCount, pendingContactRequests]
      properties:
        e164: { $ref: "#/components/schemas/E164" }
        displayName: { type: [string, "null"] }
        avatarKey: { type: [string, "null"] }
        avatarUrl: { type: [string, "null"], format: uri, description: Presigned download link, valid 15 minutes. }
        visibility: { type: string, enum: [everyone, registered_only, nobody] }
        incognito: { type: boolean }
        badge: { type: [string, "null"], enum: [supporter, gold, null] }
        supporter: { type: boolean }
        viewerCount: { type: integer, description: Profile views in the last 90 days. }
        searcherCount: { type: integer, description: Searches for this number in the last 90 days. }
        pendingContactRequests: { type: integer }

    UpdateMeRequest:
      type: object
      required: [displayName, visibility, incognito]
      properties:
        displayName: { type: [string, "null"], minLength: 1, maxLength: 60 }
        visibility: { type: string, enum: [everyone, registered_only, nobody] }
        incognito: { type: boolean }
        avatarKey: { type: [string, "null"] }

    AvatarUploadResponse:
      type: object
      required: [uploadUrl, avatarKey, contentType, maxBytes, expiresInSeconds]
      properties:
        uploadUrl: { type: string, format: uri }
        avatarKey: { type: string }
        contentType: { type: string, const: image/jpeg }
        maxBytes: { type: integer }
        expiresInSeconds: { type: integer }

    VisitorItem:
      type: object
      required: [at]
      properties:
        name: { type: [string, "null"], description: "Null when the visitor's visibility hides it." }
        badge: { type: [string, "null"], enum: [supporter, gold, null] }
        at: { type: string, format: date-time }

    VisitorsResponse:
      type: object
      required: [kind, days, total, items]
      properties:
        kind: { type: string, enum: [view, search] }
        days: { type: integer, const: 90 }
        total: { type: integer }
        items:
          type: array
          items: { $ref: "#/components/schemas/VisitorItem" }

    PublicProfileResponse:
      type: object
      required: [e164]
      properties:
        e164: { $ref: "#/components/schemas/E164" }
        name: { type: [string, "null"] }
        avatarUrl: { type: [string, "null"], format: uri }
        badge: { type: [string, "null"], enum: [supporter, gold, null] }

    ContactRequestBody:
      type: object
      required: [e164]
      properties:
        e164: { $ref: "#/components/schemas/E164" }

    ContactRequestSent:
      type: object
      required: [status]
      properties:
        status: { type: string, const: sent }

    IncomingContactRequest:
      type: object
      required: [id, requesterE164, createdAt]
      properties:
        id: { type: integer }
        requesterE164: { $ref: "#/components/schemas/E164" }
        requesterName: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }

    IncomingContactRequests:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/IncomingContactRequest" }

    ContactRequestDecision:
      type: object
      required: [id, status]
      properties:
        id: { type: integer }
        status: { type: string, enum: [approved, denied] }

    StartClaimRequest:
      type: object
      required: [e164, legalName, displayName, category]
      properties:
        e164: { $ref: "#/components/schemas/E164" }
        legalName: { type: string, minLength: 1, maxLength: 100 }
        displayName: { type: string, minLength: 1, maxLength: 100, description: Shown to callers. }
        category:
          type: string
          enum: [bank, finance, insurance, telecom, utility, government, healthcare, education, retail, delivery, travel, transport, food, services, other]
        website: { type: [string, "null"], maxLength: 200, pattern: "^https://" }
        hours: { type: [string, "null"], maxLength: 200 }
        callReason: { type: [string, "null"], maxLength: 200, description: Why the business usually calls from this number. }
        method: { type: string, enum: [sms, voice], default: sms }

    ClaimCodeRequest:
      type: object
      required: [code]
      properties:
        code: { type: string, pattern: '^[0-9]{6}$' }

    ResendCodeRequest:
      type: object
      properties:
        method: { type: string, enum: [sms, voice], default: sms }

    ClaimUploadRequest:
      type: object
      required: [kind, contentType]
      properties:
        kind: { type: string, enum: [document, logo] }
        contentType: { type: string, enum: [application/pdf, image/jpeg, image/png], description: Logos are PNG or JPEG. }

    ClaimUploadResponse:
      type: object
      required: [uploadUrl, key, contentType, maxBytes, expiresInSeconds]
      properties:
        uploadUrl: { type: string, format: uri }
        key: { type: string, description: Name it in `POST …/submit`. }
        contentType: { type: string }
        maxBytes: { type: integer }
        expiresInSeconds: { type: integer }

    SubmitClaimRequest:
      type: object
      required: [documentKeys]
      properties:
        documentKeys: { type: array, minItems: 1, maxItems: 5, items: { type: string } }
        logoKey: { type: [string, "null"] }

    ClaimResponse:
      type: object
      required: [id, e164, displayName, category, method, status, createdAt]
      properties:
        id: { type: string, format: uuid }
        e164: { $ref: "#/components/schemas/E164" }
        displayName: { type: string }
        category: { type: string }
        method: { type: string, enum: [sms, voice] }
        status: { type: string, enum: [verifying, verified, submitted, approved, rejected, withdrawn] }
        codeExpiresInSeconds: { type: [integer, "null"] }
        reviewNote: { type: [string, "null"], description: The reviewer's note on a rejected claim. }
        businessId: { type: [string, "null"], format: uuid }
        createdAt: { type: integer }

    ClaimsResponse:
      type: object
      required: [claims]
      properties:
        claims: { type: array, items: { $ref: "#/components/schemas/ClaimResponse" } }

    BusinessProfileResponse:
      type: object
      required: [id, name, verified, numbers]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        category: { type: [string, "null"] }
        website: { type: [string, "null"] }
        hours: { type: [string, "null"] }
        logoUrl: { type: [string, "null"] }
        verified: { type: boolean, const: true }
        numbers:
          type: array
          items:
            type: object
            required: [e164]
            properties:
              e164: { $ref: "#/components/schemas/E164" }
              callReason: { type: [string, "null"] }

    DirectoryResponse:
      type: object
      required: [countryIso, syncedAt, entries]
      properties:
        countryIso: { type: string }
        syncedAt: { type: integer, description: Pass as `since` next time. }
        entries:
          type: array
          items:
            type: object
            required: [e164, businessId, name, updatedAt]
            properties:
              e164: { $ref: "#/components/schemas/E164" }
              businessId: { type: string, format: uuid }
              name: { type: string }
              category: { type: [string, "null"] }
              callReason: { type: [string, "null"] }
              logoUrl: { type: [string, "null"] }
              updatedAt: { type: integer }
              removed: { type: boolean, default: false, description: The business was revoked; apps forget the number. }

    PushRegistration:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [fcm, webpush] }
        token: { type: string, maxLength: 4096, description: FCM registration token (fcm). }
        endpoint: { type: string, format: uri, maxLength: 1024, description: Web Push endpoint (webpush). }
        p256dh: { type: string, description: "The app's P-256 public key, 65 bytes uncompressed, base64url (webpush)." }
        auth: { type: string, description: "16-byte auth secret, base64url (webpush)." }

    Notification:
      type: object
      required: [id, kind, createdAt]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [call_invite, call_update, flash] }
        createdAt: { type: string, format: date-time }
        call: { $ref: "#/components/schemas/CallInvite" }
        flash: { $ref: "#/components/schemas/Flash" }

    StartCallRequest:
      type: object
      required: [to]
      properties:
        to: { type: string, description: E.164 number to call. }

    CallSession:
      type: object
      required: [inviteId, room, url, token, tokenExpiresAt, ringUntil, reachedDevices]
      properties:
        inviteId: { type: string, format: uuid }
        room: { type: string }
        url: { type: string, description: LiveKit URL (wss:// in production). }
        token: { type: string, description: LiveKit access token (JWT). }
        tokenExpiresAt: { type: string, format: date-time }
        ringUntil: { type: string, format: date-time }
        reachedDevices: { type: integer, description: "How many of the callee's phones the push reached." }

    CallInvite:
      type: object
      description: "`number`, `name` and `videoId` describe the other party; `name` and `videoId` as their profile allows, `videoId` only for the callee."
      required: [inviteId, state, role, number, ringUntil]
      properties:
        inviteId: { type: string, format: uuid }
        state: { type: string, enum: [ringing, accepted, declined, cancelled, missed, ended] }
        role: { type: string, enum: [caller, callee] }
        number: { type: string }
        name: { type: [string, "null"] }
        videoId: { type: [string, "null"], format: uuid }
        ringUntil: { type: string, format: date-time }

    RoomTokenRequest:
      type: object
      required: [inviteId]
      properties:
        inviteId: { type: string, format: uuid }

    RoomToken:
      type: object
      required: [room, url, token, expiresAt]
      properties:
        room: { type: string }
        url: { type: string }
        token: { type: string }
        expiresAt: { type: string, format: date-time }

    VoipSettings:
      type: object
      required: [reachable]
      properties:
        reachable: { type: boolean }

    SendFlashRequest:
      type: object
      required: [to, kind]
      properties:
        to: { type: string, description: E.164 number. }
        kind: { $ref: "#/components/schemas/FlashKind" }

    FlashKind:
      type: string
      enum: [call_me, on_my_way, running_late, cant_talk, arrived, call_you_back]

    FlashSent:
      type: object
      required: [id, reachedDevices]
      properties:
        id: { type: string, format: uuid }
        reachedDevices: { type: integer }

    Flash:
      type: object
      required: [id, kind, from, sentAt]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/FlashKind" }
        from: { type: string }
        name: { type: [string, "null"] }
        sentAt: { type: string, format: date-time }

    VideoUpload:
      type: object
      required: [key, uploadUrl, contentType, maxBytes, expiresAt]
      properties:
        key: { type: string }
        uploadUrl: { type: string, format: uri }
        contentType: { type: string, enum: [video/mp4] }
        maxBytes: { type: integer }
        expiresAt: { type: string, format: date-time }

    SubmitVideoRequest:
      type: object
      required: [key]
      properties:
        key: { type: string }

    MyVideo:
      type: object
      required: [job]
      properties:
        clip:
          oneOf:
            - { $ref: "#/components/schemas/VideoClip" }
            - { type: "null" }
        job: { type: string, enum: [none, uploading, queued, processing, failed] }
        error: { type: [string, "null"] }

    VideoClip:
      type: object
      required: [videoId, url, hidden]
      properties:
        videoId: { type: string, format: uuid }
        url: { type: string, format: uri, description: Pre-signed GET, 15 minutes. }
        bytes: { type: [integer, "null"] }
        hidden: { type: boolean, description: Hidden after reports. }

    VideoLinksRequest:
      type: object
      required: [ids]
      properties:
        ids: { type: array, minItems: 1, maxItems: 64, items: { type: string } }

    VideoLinks:
      type: object
      required: [links, expiresAt]
      properties:
        links:
          type: array
          items:
            type: object
            required: [id, url]
            properties:
              id: { type: string, format: uuid }
              url: { type: string, format: uri }
        expiresAt: { type: string, format: date-time }

    Problem:
      type: object
      description: RFC 9457 problem details.
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri, examples: ["urn:opencaller:problem:rate_limited"] }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code:
          type: string
          description: Stable machine-readable error code.
          enum:
            - invalid_request
            - invalid_phone_number
            - invalid_code_format
            - invalid_code
            - code_invalidated
            - code_expired
            - invalid_refresh_token
            - refresh_token_reused
            - unauthorized
            - rate_limited
            - otp_delivery_failed
            - payload_too_large
            - unsupported_media_type
            - not_found
            - method_not_allowed
            - internal_error
            - invalid_bucket
            - invalid_country
            - list_not_found
            - job_running
            - supporter_required
            - billing_not_configured
            - invalid_purchase
            - unknown_product
            - purchase_other_account
            - billing_unavailable
            - claim_open
            - already_verified
            - claim_not_found
            - claim_state
            - number_not_verified
            - business_not_found
            - invalid_push_endpoint
            - device_not_found
            - notification_not_found
            - voip_unavailable
            - not_reachable
            - call_not_found
            - call_state
            - flash_unavailable
            - invalid_flash
            - invalid_video
            - video_not_found
